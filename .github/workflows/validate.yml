name: Validate profiles and adapters

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: profiles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate source contracts and acceptance specifications
        run: python3 scripts/validate.py
      - name: Check documentation paths and source-derived counts
        run: python3 scripts/check_docs.py
      - name: Build and check deterministic exports
        run: |
          python3 scripts/build.py --adapter portable
          python3 scripts/build.py --adapter opencode
          python3 scripts/build.py --adapter portable --check
          python3 scripts/build.py --adapter opencode --check
      - name: Verify rendering and isolated installation behavior
        run: python3 -m unittest discover -s tests -v

  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build current profiles
        run: python3 scripts/build.py --adapter opencode
      - name: Fetch integrity-pinned OpenCode host
        run: python3 scripts/fetch-opencode.py --output "$RUNNER_TEMP/opencode" > host-download.json
      - name: Verify native profile and command registration without skills
        run: python3 scripts/opencode_probe.py --opencode "$RUNNER_TEMP/opencode" --expected-version 2.0.27 --agents-export dist/opencode > native-host.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-host-evidence
          path: |
            host-download.json
            native-host.json
